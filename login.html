<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FitZone - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="logo">FITZONE</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="login-section">

    <div class="login-box">

        <h2>Welcome Back</h2>
        <p>Login to your FitZone account</p>

        <form action="login" method="post">

            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <button type="submit" class="btn">
                LOGIN
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</section>

<footer>
    <p>© 2026 FitZone Gym Management System</p>
</footer>

</body>
</html>
